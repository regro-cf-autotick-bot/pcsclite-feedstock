{% set version = "2.1.0" %}

package:
  name: pcsclite
  version: {{ version }}

source:
  url: https://salsa.debian.org/rousseau/PCSC/-/archive/{{ version }}/PCSC-{{ version }}.tar.gz
  sha256: 801f2f53feb51df03e9c2785a37ed10557048809cc15503a9be8ef01cc60bdd2

build:
  skip: true  # [not linux]
  script:
    - set -e
    - set -x
    - if test -f Makefile; then make distclean; fi
    - rm -rf *.cache *.m4 config.guess config.log config.status config.sub depcomp ltmain.sh
    - autoreconf --verbose --install --force
    - ./configure --prefix=$PREFIX --sbindir=$PREFIX/bin --disable-polkit
    - make install
    - rm $PREFIX/bin/pcsc-spy
    - rm $PREFIX/lib/libpcscspy.so*
  number: 0
  run_exports:
    - {{ pin_subpackage('pcsclite', max_pin='x.x') }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ cdt('systemd-devel') }}
    - autoconf-archive
    - automake
    - flex
    - libtool
    - make
    - pkg-config
  host:
    - libudev
  run:

test:
  commands:
    - pcscd --version
    - test -f $PREFIX/include/PCSC/pcsclite.h
    # Test specific SO versions to prevent future package ABI breaks
    - test -f $PREFIX/lib/libpcsclite.so.1
    - test -f $PREFIX/lib/pkgconfig/libpcsclite.pc


about:
  home: https://pcsclite.apdu.fr/
  dev_url: https://salsa.debian.org/rousseau/PCSC
  summary: Middleware to access a smart card using SCard API (PC/SC).
  license: BSD-3-Clause and GPL-3.0-or-later and BSD-2-Clause and MIT
  license_file:
    - COPYING
    - GPL-3.0.txt

extra:
  recipe-maintainers:
    - leofang
    - thewchan
